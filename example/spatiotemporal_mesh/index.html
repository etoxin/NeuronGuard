<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NeuronGuard: 3D Quadruped Spatiotemporal Showcase</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #0b0f19;
                color: #e2e8f0;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                overflow-x: hidden;
            }
            header {
                background: linear-gradient(90deg, #1e1b4b 0%, #0f172a 100%);
                padding: 15px 30px;
                border-bottom: 1px solid #312e81;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            h1 {
                margin: 0;
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 1px;
                background: linear-gradient(to right, #38bdf8, #818cf8);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            .badge {
                background-color: #06b6d4;
                color: #0f172a;
                padding: 4px 10px;
                border-radius: 12px;
                font-size: 12px;
                font-weight: bold;
            }
            .container {
                display: flex;

            }
            .sidebar {
                width: 320px;
                background-color: #0f172a;
                border-right: 1px solid #1e293b;
                padding: 20px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                gap: 20px;
                overflow-y: auto;
            }
            .main-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                position: relative;
            }
            .viewports {
                display: flex;
                flex: 1;
                gap: 1px;
                background-color: #1e293b;
            }
            .viewport {
                flex: 1;
                position: relative;
                background-color: #0b0f19;
            }
            .viewport-title {
                position: absolute;
                top: 15px;
                left: 20px;
                font-size: 14px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #94a3b8;
                z-index: 10;
                background-color: rgba(15, 23, 42, 0.7);
                padding: 4px 10px;
                border-radius: 4px;
                border: 1px solid #1e293b;
            }
            .panel {
                background-color: #1e293b;
                border: 1px solid #334155;
                border-radius: 8px;
                padding: 15px;
            }
            .panel-title {
                margin-top: 0;
                margin-bottom: 12px;
                font-size: 16px;
                font-weight: 600;
                color: #f1f5f9;
                border-bottom: 1px solid #334155;
                padding-bottom: 6px;
            }
            button {
                background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
                color: white;
                border: none;
                padding: 10px 15px;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                width: 100%;
                margin-bottom: 8px;
            }
            button:hover {
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            }
            button.secondary {
                background: linear-gradient(135deg, #475569 0%, #334155 100%);
            }
            button.danger {
                background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            }
            .slider-group {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 12px;
            }
            .slider-group label {
                font-size: 13px;
                color: #94a3b8;
                display: flex;
                justify-content: space-between;
            }
            input[type="range"] {
                width: 100%;
                accent-color: #3b82f6;
            }
            .log-container {
                flex: 1;
                font-family: "Courier New", Courier, monospace;
                font-size: 12px;
                background-color: #020617;
                border: 1px solid #1e293b;
                border-radius: 6px;
                padding: 10px;
                overflow-y: auto;
                max-height: 200px;
                color: #38bdf8;
            }
            .log-entry {
                margin-bottom: 4px;
                line-height: 1.4;
            }
            .log-mutation {
                color: #f43f5e;
                font-weight: bold;
            }
            .log-success {
                color: #10b981;
            }
        </style>
        <!-- Three.js Library -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    </head>
    <body>
        <header>
            <div style="display: flex; align-items: center; gap: 15px">
                <h1>NeuronGuard</h1>
                <span class="badge">Permanent Spatiotemporal Mesh</span>
            </div>
            <div style="font-size: 14px; color: #94a3b8">
                Target: WASM / 3D Web App Dashboard
            </div>
        </header>

        <div class="container">
            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">Simulation Controls</div>
                    <button id="btn-play">Pause Simulation</button>
                    <button id="btn-perturb" class="danger">
                        Inject Perturbation (Push/Slip)
                    </button>
                    <button id="btn-train" class="secondary">
                        Toggle Training: ON
                    </button>
                </div>

                <div class="panel">
                    <div class="panel-title">Parameters</div>
                    <div class="slider-group">
                        <label
                            ><span>Decay Factor</span
                            ><span id="val-decay">0.90</span></label
                        >
                        <input
                            type="range"
                            id="slide-decay"
                            min="0.50"
                            max="0.99"
                            step="0.01"
                            value="0.90"
                        />
                    </div>
                    <div class="slider-group">
                        <label
                            ><span>Gait Speed</span
                            ><span id="val-speed">1.0x</span></label
                        >
                        <input
                            type="range"
                            id="slide-speed"
                            min="0.5"
                            max="2.0"
                            step="0.1"
                            value="1.0"
                        />
                    </div>
                </div>

                <div
                    class="panel"
                    style="display: flex; flex-direction: column; flex: 1"
                >
                    <div class="panel-title">Live Telemetry Log</div>
                    <div class="log-container" id="log">
                        <div class="log-entry log-success">
                            [SYSTEM] Neuromorphic mesh initialized.
                        </div>
                        <div class="log-entry">
                            [SYSTEM] Quadruped trot gait established.
                        </div>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="viewports">
                    <div class="viewport" id="viewport-robot">
                        <div class="viewport-title">
                            3D Articulated Quadruped
                        </div>
                    </div>
                    <div class="viewport" id="viewport-mesh">
                        <div class="viewport-title">
                            3D Topological Mesh Graph
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // --- Core Neuromorphic Mesh Implementation in JS (Matching Rust) ---
            const MAX_FORWARD_SLOTS = 6;
            const MAX_BACKWARD_SLOTS = 4;

            class PermanentNeuromorphicLine {
                constructor(tokenId) {
                    this.tokenId = tokenId;
                    this.activeForward = 0;
                    this.activeBackward = 0;
                    this.forwardTargets = new Array(MAX_FORWARD_SLOTS).fill(0);
                    this.backwardTargets = new Array(MAX_BACKWARD_SLOTS).fill(
                        0,
                    );
                }

                updateBackwardTargets(history) {
                    const count = Math.min(history.length, MAX_BACKWARD_SLOTS);
                    for (let i = 0; i < count; i++) {
                        this.backwardTargets[i] = history[i];
                    }
                    this.activeBackward = count;
                }

                updateOrEvictForwardTarget(correctTarget, accumulators) {
                    // Check if already exists
                    for (let i = 0; i < this.activeForward; i++) {
                        if (this.forwardTargets[i] === correctTarget) {
                            return null;
                        }
                    }

                    if (this.activeForward < MAX_FORWARD_SLOTS) {
                        this.forwardTargets[this.activeForward] = correctTarget;
                        this.activeForward++;
                        return null;
                    } else {
                        // Evict weakest target (lowest accumulator value)
                        let weakestIdx = 0;
                        let weakestVal = Infinity;

                        for (let i = 0; i < MAX_FORWARD_SLOTS; i++) {
                            const target = this.forwardTargets[i];
                            const val = accumulators[target] || 0;
                            if (val < weakestVal) {
                                weakestVal = val;
                                weakestIdx = i;
                            }
                        }

                        const evicted = this.forwardTargets[weakestIdx];
                        this.forwardTargets[weakestIdx] = correctTarget;
                        return evicted;
                    }
                }
            }

            class PermanentSpatiotemporalEnsembleMesh {
                constructor(sizePerField) {
                    this.sizePerField = sizePerField;
                    this.size = sizePerField * 3;
                    this.lines = [];
                    for (let i = 0; i < this.size; i++) {
                        this.lines.push(new PermanentNeuromorphicLine(i));
                    }
                    this.globalAccumulators = new Array(this.size).fill(0);
                    this.activeHistory = [];
                    this.mutationEvents = [];
                }

                processFrame(tokens, trainingMode, correctTarget, decayFactor) {
                    for (const tokenId of tokens) {
                        if (tokenId >= this.size) continue;

                        const line = this.lines[tokenId];

                        // Activate forward targets
                        for (let i = 0; i < line.activeForward; i++) {
                            const target = line.forwardTargets[i];
                            if (target < this.size) {
                                this.globalAccumulators[target]++;
                            }
                        }

                        // Activate backward targets
                        for (let i = 0; i < line.activeBackward; i++) {
                            const target = line.backwardTargets[i];
                            if (target < this.size) {
                                this.globalAccumulators[target]++;
                            }
                        }

                        // Update recurrent loopback targets
                        line.updateBackwardTargets(this.activeHistory);

                        // Push to history
                        this.activeHistory.unshift(tokenId);
                        if (this.activeHistory.length > MAX_BACKWARD_SLOTS) {
                            this.activeHistory.pop();
                        }

                        // Topological plasticity
                        if (
                            trainingMode &&
                            correctTarget !== null &&
                            correctTarget !== undefined
                        ) {
                            const evicted = line.updateOrEvictForwardTarget(
                                correctTarget,
                                this.globalAccumulators,
                            );
                            if (evicted !== null) {
                                this.mutationEvents.push({
                                    tokenId,
                                    evictedTarget: evicted,
                                    newTarget: correctTarget,
                                    timestampUs: Date.now() * 1000,
                                });
                            }
                        }
                    }

                    // Decay
                    this.decay(decayFactor);
                }

                decay(decayFactor) {
                    for (let i = 0; i < this.size; i++) {
                        if (this.globalAccumulators[i] > 0) {
                            this.globalAccumulators[i] = Math.floor(
                                this.globalAccumulators[i] * decayFactor,
                            );
                        }
                    }
                }

                getActiveNodes() {
                    const active = [];
                    for (let i = 0; i < this.size; i++) {
                        if (this.globalAccumulators[i] > 0) {
                            active.push(i);
                        }
                    }
                    return active;
                }

                getLoopIntensities() {
                    const intensities = {};
                    for (let i = 0; i < this.size; i++) {
                        if (this.globalAccumulators[i] > 0) {
                            intensities[i] = this.globalAccumulators[i];
                        }
                    }
                    return intensities;
                }

                getStructuralMutations() {
                    const events = [...this.mutationEvents];
                    this.mutationEvents = [];
                    return events;
                }
            }

            // --- Quadruped Simulation ---
            class QuadrupedSimulation {
                constructor() {
                    this.mesh = new PermanentSpatiotemporalEnsembleMesh(100);
                    this.phases = [0.0, Math.PI, Math.PI, 0.0]; // FL, FR, BL, BR (Trot gait: FL & BR in phase, FR & BL in phase)
                    this.velocities = [0.1, 0.1, 0.1, 0.1];
                    this.trainingMode = true;
                    this.decayFactor = 0.9;
                    this.speedMultiplier = 1.0;

                    // Initialize CPG connections: FL(0) -> BR(3) -> FR(1) -> BL(2) -> FL(0)
                    const sequence = [0, 3, 1, 2];
                    for (let i = 0; i < 4; i++) {
                        const current = sequence[i];
                        const next = sequence[(i + 1) % 4];
                        const prev = sequence[(i + 3) % 4];

                        const line = this.mesh.lines[current];
                        line.forwardTargets[0] = next;
                        line.activeForward = 1;

                        line.backwardTargets[0] = prev;
                        line.activeBackward = 1;
                    }
                }

                step(correctTarget = null) {
                    // 1. Tokenize state
                    // Spatial: leg with maximum phase
                    let maxPhase = -1;
                    let spatialLeg = 0;
                    for (let i = 0; i < 4; i++) {
                        if (this.phases[i] > maxPhase) {
                            maxPhase = this.phases[i];
                            spatialLeg = i;
                        }
                    }
                    const spatialToken = spatialLeg;

                    // Velocity token
                    const avgVel =
                        this.velocities.reduce((a, b) => a + b, 0) / 4;
                    const velBucket = avgVel > 0.15 ? 2 : avgVel > 0.05 ? 1 : 0;
                    const velocityToken = 100 + velBucket;

                    // Phase Delta: FL vs FR phase difference
                    const diff = Math.abs(this.phases[0] - this.phases[1]);
                    const diffBucket = diff > 2.0 ? 2 : diff > 1.0 ? 1 : 0;
                    const phaseDeltaToken = 200 + diffBucket;

                    const tokens = [
                        spatialToken,
                        velocityToken,
                        phaseDeltaToken,
                    ];

                    // 2. Process frame
                    this.mesh.processFrame(
                        tokens,
                        this.trainingMode,
                        correctTarget,
                        this.decayFactor,
                    );

                    // 3. Update phases based on CPG energy
                    for (let i = 0; i < 4; i++) {
                        const energy = this.mesh.globalAccumulators[i] || 0;
                        this.velocities[i] =
                            (0.05 + 0.01 * energy) * this.speedMultiplier;
                        this.phases[i] += this.velocities[i];
                        if (this.phases[i] > 2 * Math.PI) {
                            this.phases[i] -= 2 * Math.PI;
                        }
                    }
                }
            }

            // --- 3D Visualizer using Three.js ---
            let sceneRobot, cameraRobot, rendererRobot;
            let sceneMesh, cameraMesh, rendererMesh;
            let robotBody,
                legs = [];
            let meshNodes = [],
                meshEdges = [];
            let sim = new QuadrupedSimulation();
            let isPlaying = true;

            function init3D() {
                // 1. Robot Viewport
                const containerRobot =
                    document.getElementById("viewport-robot");
                sceneRobot = new THREE.Scene();
                cameraRobot = new THREE.PerspectiveCamera(
                    45,
                    containerRobot.clientWidth / containerRobot.clientHeight,
                    0.1,
                    100,
                );
                cameraRobot.position.set(4, 3, 5);
                cameraRobot.lookAt(0, 0.5, 0);

                rendererRobot = new THREE.WebGLRenderer({ antialias: true });
                rendererRobot.setSize(
                    containerRobot.clientWidth,
                    containerRobot.clientHeight,
                );
                rendererRobot.setClearColor(0x0b0f19);
                containerRobot.appendChild(rendererRobot.domElement);

                // Lights
                const ambientLightR = new THREE.AmbientLight(0x334155, 1.5);
                sceneRobot.add(ambientLightR);
                const dirLightR = new THREE.DirectionalLight(0x38bdf8, 2.0);
                dirLightR.position.set(5, 10, 7);
                sceneRobot.add(dirLightR);

                // Ground
                const gridHelper = new THREE.GridHelper(
                    20,
                    20,
                    0x334155,
                    0x1e293b,
                );
                gridHelper.position.y = -0.5;
                sceneRobot.add(gridHelper);

                // Build Robot
                const bodyGeo = new THREE.BoxGeometry(1.2, 0.4, 0.6);
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: 0x1e293b,
                    metalness: 0.8,
                    roughness: 0.2,
                });
                robotBody = new THREE.Mesh(bodyGeo, bodyMat);
                robotBody.position.y = 0.5;
                sceneRobot.add(robotBody);

                // Legs: FL, FR, BL, BR
                const legOffsets = [
                    { x: 0.5, z: 0.3, color: 0x38bdf8 }, // FL
                    { x: 0.5, z: -0.3, color: 0x818cf8 }, // FR
                    { x: -0.5, z: 0.3, color: 0x34d399 }, // BL
                    { x: -0.5, z: -0.3, color: 0xfbbf24 }, // BR
                ];

                legOffsets.forEach((offset, idx) => {
                    const hipGroup = new THREE.Group();
                    hipGroup.position.set(offset.x, 0, offset.z);

                    // Thigh (Upper Leg)
                    const thighGeo = new THREE.CylinderGeometry(
                        0.06,
                        0.04,
                        0.5,
                    );
                    const thighMat = new THREE.MeshStandardMaterial({
                        color: offset.color,
                        metalness: 0.5,
                        roughness: 0.3,
                    });
                    const thigh = new THREE.Mesh(thighGeo, thighMat);
                    thigh.position.y = -0.25;
                    hipGroup.add(thigh);

                    // Knee Joint (Sphere)
                    const kneeGroup = new THREE.Group();
                    kneeGroup.position.set(0, -0.5, 0); // Position at the bottom of the thigh

                    const kneeGeo = new THREE.SphereGeometry(0.06, 16, 16);
                    const kneeMat = new THREE.MeshStandardMaterial({
                        color: 0x475569,
                        metalness: 0.8,
                    });
                    const knee = new THREE.Mesh(kneeGeo, kneeMat);
                    kneeGroup.add(knee);

                    // Shin (Lower Leg)
                    const shinGeo = new THREE.CylinderGeometry(0.04, 0.02, 0.5);
                    const shinMat = new THREE.MeshStandardMaterial({
                        color: 0x94a3b8,
                        metalness: 0.5,
                        roughness: 0.3,
                    });
                    const shin = new THREE.Mesh(shinGeo, shinMat);
                    shin.position.y = -0.25; // Offset from knee joint
                    kneeGroup.add(shin);

                    hipGroup.add(kneeGroup);
                    robotBody.add(hipGroup);

                    // Store references to both hip and knee groups for animation
                    legs.push({
                        hip: hipGroup,
                        knee: kneeGroup,
                    });
                });

                // 2. Mesh Viewport
                const containerMesh = document.getElementById("viewport-mesh");
                sceneMesh = new THREE.Scene();
                cameraMesh = new THREE.PerspectiveCamera(
                    45,
                    containerMesh.clientWidth / containerMesh.clientHeight,
                    0.1,
                    100,
                );
                cameraMesh.position.set(0, 0, 8);

                rendererMesh = new THREE.WebGLRenderer({ antialias: true });
                rendererMesh.setSize(
                    containerMesh.clientWidth,
                    containerMesh.clientHeight,
                );
                rendererMesh.setClearColor(0x0b0f19);
                containerMesh.appendChild(rendererMesh.domElement);

                const ambientLightM = new THREE.AmbientLight(0xffffff, 1.0);
                sceneMesh.add(ambientLightM);

                // Build 3D Mesh Nodes
                // We'll represent the 4 leg nodes (0-3) and some feature/velocity nodes
                const nodePositions = [
                    {
                        id: 0,
                        label: "FL",
                        x: -1.5,
                        y: 1.5,
                        z: 0,
                        color: 0x38bdf8,
                    },
                    {
                        id: 3,
                        label: "BR",
                        x: 1.5,
                        y: -1.5,
                        z: 0,
                        color: 0xfbbf24,
                    },
                    {
                        id: 1,
                        label: "FR",
                        x: 1.5,
                        y: 1.5,
                        z: 0,
                        color: 0x818cf8,
                    },
                    {
                        id: 2,
                        label: "BL",
                        x: -1.5,
                        y: -1.5,
                        z: 0,
                        color: 0x34d399,
                    },
                    {
                        id: 101,
                        label: "Kinetic Vel",
                        x: 0,
                        y: 2.5,
                        z: 0,
                        color: 0xa855f7,
                    },
                    {
                        id: 201,
                        label: "Phase Delta",
                        x: 0,
                        y: -2.5,
                        z: 0,
                        color: 0xec4899,
                    },
                ];

                nodePositions.forEach((node) => {
                    const geo = new THREE.SphereGeometry(0.25, 32, 32);
                    const mat = new THREE.MeshBasicMaterial({
                        color: node.color,
                    });
                    const meshNode = new THREE.Mesh(geo, mat);
                    meshNode.position.set(node.x, node.y, node.z);
                    sceneMesh.add(meshNode);
                    meshNodes.push({
                        id: node.id,
                        mesh: meshNode,
                        baseColor: node.color,
                    });
                });

                // Build CPG Connections (Edges)
                const edges = [
                    { from: 0, to: 3 },
                    { from: 3, to: 1 },
                    { from: 1, to: 2 },
                    { from: 2, to: 0 },
                ];

                edges.forEach((edge) => {
                    const pFrom = nodePositions.find((n) => n.id === edge.from);
                    const pTo = nodePositions.find((n) => n.id === edge.to);

                    const points = [
                        new THREE.Vector3(pFrom.x, pFrom.y, pFrom.z),
                        new THREE.Vector3(pTo.x, pTo.y, pTo.z),
                    ];
                    const geo = new THREE.BufferGeometry().setFromPoints(
                        points,
                    );
                    const mat = new THREE.LineBasicMaterial({
                        color: 0x475569,
                        linewidth: 2,
                    });
                    const line = new THREE.Line(geo, mat);
                    sceneMesh.add(line);
                    meshEdges.push({
                        from: edge.from,
                        to: edge.to,
                        mesh: line,
                    });
                });

                window.addEventListener("resize", onWindowResize);
            }

            function onWindowResize() {
                const containerRobot =
                    document.getElementById("viewport-robot");
                cameraRobot.aspect =
                    containerRobot.clientWidth / containerRobot.clientHeight;
                cameraRobot.updateProjectionMatrix();
                rendererRobot.setSize(
                    containerRobot.clientWidth,
                    containerRobot.clientHeight,
                );

                const containerMesh = document.getElementById("viewport-mesh");
                cameraMesh.aspect =
                    containerMesh.clientWidth / containerMesh.clientHeight;
                cameraMesh.updateProjectionMatrix();
                rendererMesh.setSize(
                    containerMesh.clientWidth,
                    containerMesh.clientHeight,
                );
            }

            // --- Log Telemetry Helper ---
            function logMessage(msg, type = "") {
                const log = document.getElementById("log");
                const entry = document.createElement("div");
                entry.className = "log-entry " + type;
                entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                log.appendChild(entry);
                log.scrollTop = log.scrollHeight;
            }

            // --- Main Animation Loop ---
            let stepCount = 0;
            function animate() {
                requestAnimationFrame(animate);

                if (isPlaying) {
                    stepCount++;
                    sim.step();

                    // 1. Update Robot 3D Model
                    // Trot gait: FL & BR move together, FR & BL move together
                    for (let i = 0; i < 4; i++) {
                        const phase = sim.phases[i];
                        // Hip rotation (swinging forward and backward)
                        legs[i].hip.rotation.z = Math.sin(phase) * 0.4;

                        // Knee rotation (bending during swing phase, straightening during stance)
                        // When sin(phase) > 0, the leg is swinging forward, so we bend the knee!
                        const swingPhase = Math.sin(phase);
                        if (swingPhase > 0) {
                            legs[i].knee.rotation.z = -swingPhase * 0.6; // Bend knee backward
                        } else {
                            legs[i].knee.rotation.z = 0; // Straighten knee on ground contact
                        }
                    }

                    // Body bounce & tilt
                    robotBody.position.y =
                        0.5 + Math.sin(sim.phases[0] * 2) * 0.05;
                    robotBody.rotation.z = Math.sin(sim.phases[0]) * 0.02;

                    // 2. Update Mesh 3D Visualization
                    const activeNodes = sim.mesh.getActiveNodes();
                    const intensities = sim.mesh.getLoopIntensities();

                    // Flash active nodes
                    meshNodes.forEach((node) => {
                        if (activeNodes.includes(node.id)) {
                            const intensity = intensities[node.id] || 1;
                            node.mesh.scale.set(
                                1 + intensity * 0.1,
                                1 + intensity * 0.1,
                                1 + intensity * 0.1,
                            );
                            node.mesh.material.color.setHex(0xffffff); // Flash white
                        } else {
                            node.mesh.scale.set(1, 1, 1);
                            node.mesh.material.color.setHex(node.baseColor);
                        }
                    });

                    // Glow loopback lines based on intensities
                    meshEdges.forEach((edge) => {
                        const fromIntensity = intensities[edge.from] || 0;
                        const toIntensity = intensities[edge.to] || 0;
                        const avgIntensity = (fromIntensity + toIntensity) / 2;

                        if (avgIntensity > 0) {
                            edge.mesh.material.color.setHex(0x38bdf8); // Cyan glow
                            edge.mesh.material.linewidth = 2 + avgIntensity;
                        } else {
                            edge.mesh.material.color.setHex(0x475569); // Default gray
                            edge.mesh.material.linewidth = 2;
                        }
                    });

                    // Log telemetry occasionally
                    if (stepCount % 30 === 0) {
                        logMessage(
                            `Gait step ${stepCount}. Active Nodes: [${activeNodes.join(", ")}]`,
                        );
                    }

                    // Check for structural mutations
                    const mutations = sim.mesh.getStructuralMutations();
                    mutations.forEach((mut) => {
                        logMessage(
                            `STRUCTURAL MUTATION: Token ${mut.tokenId} evicted ${mut.evictedTarget} ➔ Patched to ${mut.newTarget}`,
                            "log-mutation",
                        );
                    });
                }

                rendererRobot.render(sceneRobot, cameraRobot);
                rendererMesh.render(sceneMesh, cameraMesh);
            }

            // --- Event Listeners ---
            document
                .getElementById("btn-play")
                .addEventListener("click", () => {
                    isPlaying = !isPlaying;
                    document.getElementById("btn-play").innerText = isPlaying
                        ? "Pause Simulation"
                        : "Resume Simulation";
                    logMessage(
                        isPlaying
                            ? "Simulation resumed."
                            : "Simulation paused.",
                    );
                });

            document
                .getElementById("btn-perturb")
                .addEventListener("click", () => {
                    logMessage(
                        "PERTURBATION INJECTED! Simulating external push/slip...",
                        "log-mutation",
                    );

                    // Knock FR and BL out of phase to disrupt the trot gait
                    sim.phases[1] = sim.phases[0] + 0.2; // FR out of phase
                    sim.phases[2] = sim.phases[0] - 0.2; // BL out of phase

                    // Trigger transactional structural re-patch of anomalous token 99 to target FL(0)
                    const start = performance.now();
                    sim.step(0); // Force re-patching
                    const elapsed = performance.now() - start;

                    logMessage(
                        `Transactional re-patch completed in ${elapsed.toFixed(4)} ms! (Target: < 16.6 ms)`,
                        "log-success",
                    );
                });

            document
                .getElementById("btn-train")
                .addEventListener("click", () => {
                    sim.trainingMode = !sim.trainingMode;
                    document.getElementById("btn-train").innerText =
                        sim.trainingMode
                            ? "Toggle Training: ON"
                            : "Toggle Training: OFF";
                    document.getElementById("btn-train").className =
                        sim.trainingMode ? "secondary" : "secondary danger";
                    logMessage(
                        `Training mode toggled to ${sim.trainingMode ? "ON" : "OFF"}.`,
                    );
                });

            document
                .getElementById("slide-decay")
                .addEventListener("input", (e) => {
                    const val = parseFloat(e.target.value);
                    sim.decayFactor = val;
                    document.getElementById("val-decay").innerText =
                        val.toFixed(2);
                    logMessage(`Decay factor adjusted to ${val.toFixed(2)}.`);
                });

            document
                .getElementById("slide-speed")
                .addEventListener("input", (e) => {
                    const val = parseFloat(e.target.value);
                    sim.speedMultiplier = val;
                    document.getElementById("val-speed").innerText =
                        val.toFixed(1) + "x";
                    logMessage(`Gait speed adjusted to ${val.toFixed(1)}x.`);
                });

            // Start everything
            init3D();
            animate();
        </script>
    </body>
</html>
