[tools]
python = "3.12"
uv = "latest"

[tasks."examples:fraud_scanner:run"]
description = "Run the NeuronGuard High-Frequency Financial Fraud Scanner"
run = "uv run --no-project python main.py"

[tasks."examples:fraud_scanner:download_data"]
description = "Download the complete Credit Card Fraud dataset"
run = """
mkdir -p data
curl -L --fail --retry 3 -o data/creditcard.csv https://raw.githubusercontent.com/nsethi31/Kaggle-Data-Credit-Card-Fraud-Detection/master/creditcard.csv
"""
