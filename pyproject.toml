[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "neuronguard"
version = "0.2.0"
description = "A fast, transparent sparse decision layer for edge inference, streaming classification, and routing"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
benchmark = [
    "psutil>=5.9",
    "scikit-learn>=1.3,<1.4; python_version == '3.8'",
    "scikit-learn>=1.4; python_version >= '3.9'",
]

[tool.maturin]
# Mixed Rust/Python project: maturin will place the compiled .so
# inside the neuronguard/ package directory alongside the Python SDK.
python-source = "."
module-name = "neuronguard.neuronguard"
