[tools]
rust = "latest"
python = "3.12"
uv = "latest"

[tasks.download_data]
description = "Download and extract AG News and DBpedia datasets"
run = """
mkdir -p example/ag_news/data
curl -s -o example/ag_news/data/train.csv https://raw.githubusercontent.com/mhjabreel/CharCnn_Keras/master/data/ag_news_csv/train.csv
curl -s -o example/ag_news/data/test.csv https://raw.githubusercontent.com/mhjabreel/CharCnn_Keras/master/data/ag_news_csv/test.csv
mkdir -p example/dbpedia
curl -s -o example/dbpedia/dbpedia_csv.tgz https://s3.amazonaws.com/fast-ai-nlp/dbpedia_csv.tgz
tar -xzf example/dbpedia/dbpedia_csv.tgz -C example/dbpedia/
rm example/dbpedia/dbpedia_csv.tgz
"""

[tasks.poc]
run = "cargo run --bin neuron-poc"

[tasks.llm_router]
run = "cargo run --bin llm-router"

[tasks.ag_news]
run = "cargo run --bin ag-news"

[tasks.dbpedia]
run = "cargo run --bin dbpedia"

[tasks.run]
run = "cargo run"

[tasks.build]
description = "Build the Rust library and binaries"
run = "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo build"

[tasks.test]
description = "Run all Rust unit tests"
run = "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo test"

[tasks.py-setup]
description = "Set up the Python virtual environment using uv"
run = "uv venv && uv pip install maturin"

[tasks.py-build]
description = "Build and install the Python extension using uv and maturin"
run = "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 uv run --no-project maturin develop --release --features extension-module"

[tasks.py-test]
description = "Run the Python verification script"
run = "uv run --no-project python verify.py"

[tasks.clean_models]
description = "Clean up old pre-trained models and vocab files"
run = "rm -f example/dbpedia/dbpedia_weights.bin example/dbpedia/dbpedia_vocab.txt"
