[tools]
rust = "latest"
uv = "latest"
python = "3.12"

[env]
TEMPERATURE = "0.6"
TRAIN_BOOKS = "50"
START_ID = "400"
BOOK_URLS = ""

# Toggle configuration tiers by commenting out/in targets
# Tier 1 (Default Edge Baseline - ~6.40 MB Footprint)
VOCAB_SIZE = "1000000"

# Tier 2 (High Capacity 1 GB Scale - ~1.024 GB Footprint)
# VOCAB_SIZE = "8000000"

# Tier 3 (Massive Narrative 2 GB Scale - ~2.048 GB Footprint)
# VOCAB_SIZE = "16000000"

[tasks.build]
description = "Build the Rust library and binaries"
run = "cargo build --release"

[tasks.rust-test]
description = "Run all Rust unit tests"
run = "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo test --no-default-features"

[tasks.test]
description = "Execute deterministic semantic integration verification over a closed 4-phrase corpus"
run = "uv run --no-project python run_controlled_tests.py"

[tasks.py-setup]
description = "Set up the Python virtual environment using uv"
run = "uv venv && uv pip install maturin tiktoken datasets requests"

[tasks.py-build]
description = "Build and install the Python extension using uv and maturin"
run = "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 uv run --no-project maturin develop --release --features extension-module"

[tasks.py-test]
description = "Run the Python verification script"
run = "uv run --no-project python verify.py"

[tasks.train]
description = "Stream Project Gutenberg corpus to build model weights matching configuration limits"
run = "uv run --no-project python train_stream_harvester.py"

[tasks.chat]
description = "Boot the TPI neuromorphic active chat interface"
run = "uv run --no-project python chat.py"

[tasks.clean_models]
description = "Clean up old pre-trained models, vocab files, and book caches"
run = "rm -f wikipedia_weights.txt wikipedia_vocab.txt test_weights.txt && rm -rf books_cache"
