[tools]
rust = "latest"
uv = "latest"
python = "3.12"

[vars]
train_books = "25"
vocab_size = "50000"
temperature = "0.7"
book_urls = ""

[tasks.build]
description = "Build the Rust library and binaries"
run = "cargo build --release"

[tasks.test]
description = "Run all Rust unit tests"
run = "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo test --no-default-features"

[tasks.py-setup]
description = "Set up the Python virtual environment using uv"
run = "uv venv && uv pip install maturin tiktoken datasets requests"

[tasks.py-build]
description = "Build and install the Python extension using uv and maturin"
run = "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 uv run --no-project maturin develop --release --features extension-module"

[tasks.py-test]
description = "Run the Python verification script"
run = "uv run --no-project python verify.py"

[tasks.train-gen]
description = "Run the generative SNN-LM training pipeline on Project Gutenberg books"
run = "uv run --no-project python train_stream_harvester.py"
env = { TRAIN_BOOKS = "{{vars.train_books}}", VOCAB_SIZE = "{{vars.vocab_size}}", BOOK_URLS = "{{vars.book_urls}}" }

[tasks.chat]
description = "Start the interactive chat session with the SNN-LM"
run = "uv run --no-project python chat.py"
env = { VOCAB_SIZE = "{{vars.vocab_size}}", TEMPERATURE = "{{vars.temperature}}" }

[tasks.clean_models]
description = "Clean up old pre-trained models and vocab files"
run = "rm -f wikipedia_weights.txt wikipedia_vocab.txt test_weights.txt"
