[package]
name = "neuronguard"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.8"
memmap2 = "0.9"
parking_lot = "0.12"
pyo3 = { version = "0.21", features = ["experimental-declarative-modules"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[lib]
name = "neuronguard"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
